<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Recorder + Live Transcript</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.2);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #22d3ee;
      --accent-2: #06b6d4;
      --danger: #ef4444;
      --ok: #16a34a;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 700px at 80% -10%, #0ea5e955 0%, transparent 60%),
        radial-gradient(900px 600px at 0% 100%, #22c55e33 0%, transparent 55%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(920px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
      animation: rise 400ms ease-out;
    }

    @keyframes rise {
      from {
        transform: translateY(14px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--card-border);
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.12), rgba(6, 182, 212, 0.04));
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      letter-spacing: 0.2px;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .content {
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      color: #04131a;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      font-weight: 700;
      letter-spacing: 0.2px;
      padding: 10px 14px;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .danger {
      color: #fee2e2;
      background: linear-gradient(180deg, #dc2626, #b91c1c);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 0 0 transparent;
      transition: background 150ms ease;
    }

    .dot.recording {
      background: var(--danger);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card {
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.45);
      padding: 14px;
    }

    .label {
      margin: 0 0 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .transcript {
      margin: 0;
      min-height: 140px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: var(--text);
      font-size: 1rem;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    audio {
      width: 100%;
      border-radius: 8px;
    }

    .ok {
      color: #bbf7d0;
    }

    @media (max-width: 640px) {
      .panel {
        border-radius: 16px;
      }

      .content,
      .header {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="panel" role="main">
    <header class="header">
      <h1>Voice Recorder + Live Transcript</h1>
      <p>Press start, speak into your mic, then stop to review transcript and recording.</p>
    </header>

    <section class="content">
      <div class="controls">
        <button id="startBtn" type="button">Start Recording</button>
        <button id="stopBtn" type="button" class="danger" disabled>Stop</button>
        <button id="clearBtn" type="button" class="secondary">Clear Transcript</button>
        <button id="copyBtn" type="button" class="secondary">Copy Transcript</button>
        <a id="downloadLink" class="secondary" style="display:inline-flex;align-items:center;padding:10px 14px;border-radius:12px;text-decoration:none;color:var(--text);border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.12);pointer-events:none;opacity:0.45;">Download Recording</a>
      </div>

      <div class="status">
        <span id="dot" class="dot" aria-hidden="true"></span>
        <span id="statusText">Idle</span>
      </div>

      <div class="grid">
        <article class="card">
          <p class="label">Transcript</p>
          <p id="transcript" class="transcript">Your transcript will appear here.</p>
          <p class="hint">Tip: This uses browser speech recognition (works best in Chrome/Edge).</p>
        </article>

        <article class="card">
          <p class="label">Audio Preview</p>
          <audio id="audioPreview" controls></audio>
        </article>
      </div>
    </section>
  </main>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const transcriptEl = document.getElementById('transcript');
    const audioPreview = document.getElementById('audioPreview');
    const downloadLink = document.getElementById('downloadLink');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let mediaStream = null;
    let mediaRecorder = null;
    let chunks = [];
    let recognition = null;
    let finalTranscript = '';
    let isRecording = false;

    function setStatus(text, recording = false) {
      statusText.textContent = text;
      dot.classList.toggle('recording', recording);
    }

    function setRecordingUi(recording) {
      isRecording = recording;
      startBtn.disabled = recording;
      stopBtn.disabled = !recording;
      setStatus(recording ? 'Recording... Speak now' : 'Idle', recording);
    }

    function appendTranscript(text) {
      finalTranscript = `${finalTranscript} ${text}`.trim();
      transcriptEl.textContent = finalTranscript || 'Your transcript will appear here.';
    }

    function setupRecognition() {
      if (!SpeechRecognition) {
        transcriptEl.textContent = 'SpeechRecognition is not supported in this browser. Use Chrome or Edge.';
        setStatus('Speech recognition unsupported');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'en-US';
      rec.interimResults = true;
      rec.continuous = true;

      rec.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const phrase = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            appendTranscript(phrase);
          } else {
            interim += phrase;
          }
        }

        const merged = [finalTranscript, interim].filter(Boolean).join(' ');
        transcriptEl.textContent = merged || 'Your transcript will appear here.';
      };

      rec.onerror = (event) => {
        setStatus(`Speech error: ${event.error}`);
      };

      rec.onend = () => {
        // Keep recognition alive while recording unless user stopped.
        if (isRecording) {
          try {
            rec.start();
          } catch {
            // No-op: browser may reject immediate restart.
          }
        }
      };

      return rec;
    }

    async function startRecording() {
      try {
        finalTranscript = finalTranscript || '';
        chunks = [];
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(mediaStream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          audioPreview.src = url;
          downloadLink.href = url;
          downloadLink.download = `recording-${Date.now()}.webm`;
          downloadLink.style.pointerEvents = 'auto';
          downloadLink.style.opacity = '1';
          setStatus('Stopped. Transcript ready.', false);
        };

        recognition = setupRecognition();

        mediaRecorder.start();
        if (recognition) {
          recognition.start();
        }

        setRecordingUi(true);
      } catch (error) {
        setStatus(`Microphone error: ${error.message}`);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      if (recognition) {
        try {
          recognition.stop();
        } catch {
          // Ignore stop race.
        }
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
      }

      setRecordingUi(false);
    }

    startBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);

    clearBtn.addEventListener('click', () => {
      finalTranscript = '';
      transcriptEl.textContent = 'Your transcript will appear here.';
      setStatus('Transcript cleared.');
    });

    copyBtn.addEventListener('click', async () => {
      try {
        if (!finalTranscript) {
          setStatus('Nothing to copy yet.');
          return;
        }
        await navigator.clipboard.writeText(finalTranscript);
        setStatus('Transcript copied.', false);
        statusText.classList.add('ok');
        setTimeout(() => statusText.classList.remove('ok'), 900);
      } catch {
        setStatus('Copy failed. Allow clipboard permission.');
      }
    });
  </script>
</body>
</html>
